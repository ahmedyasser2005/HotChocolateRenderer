name: HCR Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Cache CUDA Directory
        id: cuda-cache
        uses: actions/cache@v6.1.0
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3-nvcc-cudart-crt-nvvm-nvptx-vsint-${{ runner.os }}

      - name: Install CUDA Toolkit (Cache Miss)
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.0"
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "nvptxcompiler", "visual_studio_integration"]'
          method: local
          use-github-cache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore MSBuild CUDA Targets (Cache Hit)
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $extPath = Join-Path $cudaPath "extras\visual_studio_integration\MSBuildExtensions"

          # Locate the VS2026 BuildCustomizations directory (v180 toolset)
          $vsPath = vswhere.exe -latest -requires Microsoft.Component.MSBuild -property installationPath
          $customizationsPath = Join-Path $vsPath "MSBuild\Microsoft\VC\v180\BuildCustomizations"

          # Inject the cached CUDA targets into MSBuild
          Write-Host "Injecting CUDA targets into $customizationsPath"
          Copy-Item -Path "$extPath\*" -Destination $customizationsPath -Force -Recurse

          # Manually set the environment variables normally created by the installer
          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDA_PATH_V13_3=$cudaPath" >> $env:GITHUB_ENV
          echo "$cudaPath\bin" >> $env:GITHUB_PATH

      - name: Build solution
        run: >
          msbuild HotChocolateRenderer.slnx
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Package application
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "build\Release-x64"
          $packageDirectory = Join-Path $env:RUNNER_TEMP "HCR-package"
          $requiredFiles = @(
            "HCR.Application.exe",
            "PixelShader.cso",
            "VertexShader.cso",
            "README.md",
            "LICENSE"
          )

          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          foreach ($file in $requiredFiles) {
            $sourceDirectory = if ($file -in @("README.md", "LICENSE")) { $env:GITHUB_WORKSPACE } else { $releaseDirectory }
            $source = Join-Path $sourceDirectory $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required release file was not produced: $source"
            }
            Copy-Item -LiteralPath $source -Destination $packageDirectory
          }

          $archive = "HCR-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $archive

      - name: Upload release package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64-release
          path: HCR-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-x64-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: HCR ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
