name: HCR CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Cache CUDA Directory
        id: cuda-cache
        uses: actions/cache@v6.1.0
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3-nvcc-cudart-crt-nvvm-nvptx-vsint-${{ runner.os }}

      - name: Install CUDA Toolkit (Cache Miss)
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.0"
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "nvptxcompiler", "visual_studio_integration"]'
          method: local
          use-github-cache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore MSBuild CUDA Targets (Cache Hit)
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $extPath = Join-Path $cudaPath "extras\visual_studio_integration\MSBuildExtensions"

          # Locate the VS2026 BuildCustomizations directory (v180 toolset)
          $vsPath = vswhere.exe -latest -requires Microsoft.Component.MSBuild -property installationPath
          $customizationsPath = Join-Path $vsPath "MSBuild\Microsoft\VC\v180\BuildCustomizations"

          # Inject the cached CUDA targets into MSBuild
          Write-Host "Injecting CUDA targets into $customizationsPath"
          Copy-Item -Path "$extPath\*" -Destination $customizationsPath -Force -Recurse

          # Manually set the environment variables normally created by the installer
          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDA_PATH_V13_3=$cudaPath" >> $env:GITHUB_ENV
          echo "$cudaPath\bin" >> $env:GITHUB_PATH

      - name: Build solution
        run: >
          msbuild HotChocolateRenderer.slnx
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /verbosity:minimal
